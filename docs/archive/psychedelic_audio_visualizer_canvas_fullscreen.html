<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Psychedelic Audio Visualizer</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* Minimal overlay UI */
    #ui {
      position: fixed;
      inset: 12px 12px auto auto;
      display: flex;
      gap: 8px;
      z-index: 10;
      align-items: center;
      user-select: none;
    }
    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.35);
      color: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-weight: 600;
      letter-spacing: .2px;
    }
    button:hover { background: rgba(255,255,255,.08); }
    button:active { transform: translateY(1px); }

    #hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.35);
      color: rgba(255,255,255,.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 13px;
      line-height: 1.35;
      max-width: min(520px, calc(100vw - 24px));
    }
    #hint kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
    }
    .hidden { display: none !important; }

    /* Keep UI accessible on very small screens */
    @media (max-width: 420px) {
      #ui { inset: 10px 10px auto auto; }
      button { padding: 9px 10px; border-radius: 10px; }
      #hint { font-size: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="ui">
    <div id="modeLabel" style="
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.35);
      color: #fff;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    ">Tunnel</div>
    <button id="btnStart" title="Start audio input">Start</button>
    <button id="btnFS" title="Toggle fullscreen">Fullscreen</button>
    <button id="btnHide" title="Hide/Show UI">Hide UI</button>
  </div>

  <div id="hint">
    <div><strong>Controls</strong></div>
    <div>
      <kbd>F</kbd> fullscreen · <kbd>H</kbd> hide UI · <kbd>←</kbd>/<kbd>→</kbd> switch mode · <kbd>Space</kbd> pause
    </div>
    <div style="margin-top:6px; opacity:.9;">
      Click <strong>Start</strong> and allow microphone access.
    </div>
  </div>

  <script>
  (() => {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

    const ui = document.getElementById('ui');
    const hint = document.getElementById('hint');
    const btnStart = document.getElementById('btnStart');
    const btnFS = document.getElementById('btnFS');
    const btnHide = document.getElementById('btnHide');
    const modeLabel = document.getElementById('modeLabel');

    // HiDPI resize
    function resize() {
      const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      const w = Math.floor(window.innerWidth * dpr);
      const h = Math.floor(window.innerHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    // Audio
    let audioCtx = null;
    let analyser = null;
    let freq = null;
    let time = null;
    let started = false;

    async function startAudio() {
      if (started) return;
      started = true;

      // iOS / autoplay policies: must be inside a user gesture.
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.85;

      freq = new Uint8Array(analyser.frequencyBinCount);
      time = new Uint8Array(analyser.fftSize);

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });
        const src = audioCtx.createMediaStreamSource(stream);
        src.connect(analyser);
        btnStart.textContent = 'Mic OK';
        btnStart.disabled = true;
      } catch (e) {
        started = false;
        console.error(e);
        btnStart.textContent = 'Mic blocked';
      }
    }

    btnStart.addEventListener('click', startAudio);

    // Fullscreen
    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {
        console.warn('Fullscreen failed:', e);
      }
    }
    btnFS.addEventListener('click', toggleFullscreen);

    // Hide UI
    let uiHidden = false;
    function setUIHidden(v) {
      uiHidden = v;
      ui.classList.toggle('hidden', uiHidden);
      hint.classList.toggle('hidden', uiHidden);
      btnHide.textContent = uiHidden ? 'Show UI' : 'Hide UI';
    }
    btnHide.addEventListener('click', () => setUIHidden(!uiHidden));

    // Visual modes (switch with arrow keys)
    const MODES = ['tunnel', 'ribbons', 'plasma', 'kaleido', 'orbitals', 'gridwarp', 'strobebloom'];
    const MODE_LABELS = {
      tunnel: 'TUNNEL',
      ribbons: 'RIBBONS',
      plasma: 'PLASMA',
      kaleido: 'KALEIDO',
      orbitals: 'ORBITALS',
      gridwarp: 'GRID WARP',
      strobebloom: 'STROBE BLOOM'
    };
    let modeIndex = 0;
    function updateModeLabel() {
      const key = MODES[modeIndex];
      modeLabel.textContent = MODE_LABELS[key] || String(key).toUpperCase();
    }
    updateModeLabel();

    // Pause
    let paused = false;

    // Transient / flash state (for strobe-like moments, with limiter)
    let prevEnergy = 0;
    let flash = 0;

    // Helpers
    const TAU = Math.PI * 2;
    const clamp01 = (x) => Math.max(0, Math.min(1, x));
    function avgBand(arr, from, to) {
      let s = 0;
      for (let i = from; i < to; i++) s += arr[i];
      return s / Math.max(1, (to - from));
    }

    // Animation state
    let t0 = performance.now();
    let hueBase = 0;

    // Simple trail effect via alpha fill
    function fade(alpha) {
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // ---- Modes ----

    function drawTunnel(dt, bass, mid, treble) {
      const w = canvas.width, h = canvas.height;
      const cx = w * 0.5, cy = h * 0.5;

      // Reactive parameters
      const speed = 0.35 + 1.2 * bass;
      const wobble = 0.25 + 1.4 * mid;
      const rings = 40;

      // Background fade (strong trails)
      fade(0.08);

      // Rings
      const maxR = Math.hypot(cx, cy);
      const phase = (performance.now() - t0) * 0.001 * speed;
      for (let i = 0; i < rings; i++) {
        const p = i / (rings - 1);
        const r = p * maxR;
        const a = phase * (1.6 + 2.8 * p);
        const ox = Math.cos(a * 0.7) * wobble * 0.12 * w;
        const oy = Math.sin(a * 0.9) * wobble * 0.12 * h;

        const thick = 1 + (1 - p) * (2 + 10 * bass);
        const hue = (hueBase + 220 * p + 120 * treble) % 360;

        ctx.beginPath();
        ctx.lineWidth = thick;
        ctx.strokeStyle = `hsla(${hue}, 100%, ${55 + 20 * (1 - p)}%, ${0.22 + 0.55 * (1 - p)})`;
        const rr = r * (0.72 + 0.28 * (1 + Math.sin(a + p * 6)) * 0.5);
        ctx.ellipse(cx + ox, cy + oy, rr, rr * (0.84 + 0.22 * Math.sin(a * 0.6 + p * 5)), a * 0.2, 0, TAU);
        ctx.stroke();
      }

      // Center pulse
      const pulse = 6 + 140 * bass;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${(hueBase + 30) % 360}, 100%, 60%, 0.45)`;
      ctx.arc(cx, cy, pulse, 0, TAU);
      ctx.fill();
    }

    function drawRibbons(dt, bass, mid, treble, waveform) {
      const w = canvas.width, h = canvas.height;
      fade(0.10);

      const lines = 7;
      const amp = (0.12 + 0.55 * mid) * h;
      const drift = (performance.now() - t0) * 0.001 * (0.35 + 1.1 * bass);

      ctx.lineCap = 'round';
      for (let l = 0; l < lines; l++) {
        const lane = (l + 1) / (lines + 1);
        const y0 = lane * h;
        const hue = (hueBase + l * 28 + 180 * treble) % 360;

        ctx.beginPath();
        ctx.lineWidth = 2 + 10 * bass;
        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${0.18 + 0.22 * (1 - l / lines)})`;

        const steps = 160;
        for (let i = 0; i <= steps; i++) {
          const x = (i / steps) * w;
          const idx = Math.floor((i / steps) * (waveform.length - 1));
          const v = (waveform[idx] - 128) / 128; // -1..1
          const wob = Math.sin((i * 0.10) + drift + l) * (0.18 + 0.35 * treble);
          const y = y0 + (v * amp) * (0.15 + 0.85 * (l / lines)) + wob * amp * 0.22;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // Add a few glowing particles
      const particles = 18;
      for (let i = 0; i < particles; i++) {
        const p = i / particles;
        const x = ((p + drift * 0.08) % 1) * w;
        const y = (0.5 + 0.35 * Math.sin(drift * 1.7 + p * TAU)) * h;
        const r = 2 + 10 * treble + 14 * bass * (0.2 + 0.8 * Math.sin(drift + p * TAU) ** 2);
        const hue = (hueBase + 120 + p * 180) % 360;
        ctx.beginPath();
        ctx.fillStyle = `hsla(${hue}, 100%, 65%, 0.20)`;
        ctx.arc(x, y, r, 0, TAU);
        ctx.fill();
      }
    }

    function drawPlasma(dt, bass, mid, treble) {
      const w = canvas.width, h = canvas.height;

      // Lighter trails, more "surface"
      fade(0.06);

      const tm = (performance.now() - t0) * 0.001;
      const s = 0.9 + 1.6 * (bass * 0.7 + mid * 0.3);

      // Draw a coarse grid of circles to fake a plasma field (cheap)
      const step = Math.floor(Math.max(14, Math.min(32, 28 - 12 * (bass + mid))));
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const nx = (x / w - 0.5) * 2;
          const ny = (y / h - 0.5) * 2;

          const v =
            Math.sin((nx * 3.2 + tm * 0.9) * s) +
            Math.sin((ny * 4.1 - tm * 1.1) * s) +
            Math.sin((nx * 2.2 + ny * 2.7 + tm * 0.7) * s);

          const vv = (v + 3) / 6; // 0..1
          const hue = (hueBase + 260 * vv + 160 * treble) % 360;
          const a = 0.06 + 0.22 * vv + 0.20 * treble;
          const r = 1.5 + 2.5 * vv + 10 * bass;

          ctx.beginPath();
          ctx.fillStyle = `hsla(${hue}, 100%, ${50 + 20 * vv}%, ${a})`;
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        }
      }

      // Bass "shockwaves"
      const cx = w * 0.5, cy = h * 0.5;
      const waves = 3;
      for (let i = 0; i < waves; i++) {
        const p = (tm * (0.6 + bass * 1.8) + i / waves) % 1;
        const rr = p * Math.hypot(cx, cy);
        ctx.beginPath();
        ctx.lineWidth = 1 + 6 * bass;
        ctx.strokeStyle = `hsla(${(hueBase + 30 + i * 40) % 360}, 100%, 60%, ${0.16 * (1 - p)})`;
        ctx.arc(cx, cy, rr, 0, TAU);
        ctx.stroke();
      }
    }

    function drawKaleido(dt, bass, mid, treble, spectrum) {
      const w = canvas.width, h = canvas.height;
      const cx = w * 0.5, cy = h * 0.5;

      // Strong trails for hypnotic persistence
      fade(0.09);

      const tm = (performance.now() - t0) * 0.001;
      const seg = 12 + Math.floor(10 * treble);           // 12..22
      const bars = 72;                                    // radial bars per segment
      const maxR = Math.min(w, h) * (0.42 + 0.10 * bass);

      // Additive glow
      ctx.save();
      ctx.translate(cx, cy);
      ctx.globalCompositeOperation = 'lighter';

      const rot = tm * (0.25 + 1.6 * (bass * 0.7 + mid * 0.3));
      for (let s = 0; s < seg; s++) {
        const mirror = (s % 2) === 0 ? 1 : -1;
        ctx.save();
        ctx.rotate(rot + (s / seg) * TAU);
        ctx.scale(mirror, 1);

        for (let i = 0; i < bars; i++) {
          const p = i / (bars - 1);
          const idx = Math.floor(p * (spectrum.length - 1));
          const v = spectrum[idx] / 255;

          const a = p * (TAU / seg) * 0.92;
          const r0 = (0.08 + 0.55 * p) * maxR;
          const r1 = r0 + (10 + 90 * v) * (0.25 + 0.75 * (0.4 * mid + 0.6 * treble));

          const hue = (hueBase + 240 * p + 140 * v) % 360;
          ctx.beginPath();
          ctx.lineWidth = 1 + 6 * (v * 0.7 + bass * 0.3);
          ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${0.06 + 0.22 * v})`;
          ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
          ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Center bloom
      const core = 8 + 220 * bass;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${(hueBase + 40) % 360}, 100%, 60%, 0.22)`;
      ctx.arc(0, 0, core, 0, TAU);
      ctx.fill();

      ctx.restore();
    }

    function drawOrbitals(dt, bass, mid, treble, waveform) {
      const w = canvas.width, h = canvas.height;
      const cx = w * 0.5, cy = h * 0.5;

      // Very smooth trails
      fade(0.07);

      const tm = (performance.now() - t0) * 0.001;
      const count = 140 + Math.floor(420 * (bass * 0.7 + treble * 0.3));
      const R = Math.min(w, h) * (0.28 + 0.10 * mid);

      // Additive particles
      ctx.save();
      ctx.translate(cx, cy);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = 0; i < count; i++) {
        const p = i / count;
        const idx = Math.floor(p * (waveform.length - 1));
        const v = (waveform[idx] - 128) / 128; // -1..1

        // Lissajous-ish orbits
        const a = tm * (0.9 + 2.0 * bass) + p * TAU;
        const b = tm * (1.3 + 1.7 * mid) + p * TAU * 1.7;

        const x = Math.cos(a) * R * (0.35 + 0.85 * (0.5 + 0.5 * Math.sin(b))) + Math.cos(b * 0.6) * R * 0.12;
        const y = Math.sin(b) * R * (0.35 + 0.85 * (0.5 + 0.5 * Math.sin(a))) + Math.sin(a * 0.7) * R * 0.12;

        const rr = 0.8 + 2.8 * (0.5 + 0.5 * v) + 10 * treble;
        const hue = (hueBase + 360 * p + 140 * (0.5 + 0.5 * v)) % 360;
        const alpha = 0.035 + 0.10 * treble + 0.08 * bass;

        ctx.beginPath();
        ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
        ctx.arc(x, y, rr, 0, TAU);
        ctx.fill();
      }

      // Thin spinning ring
      ctx.beginPath();
      ctx.lineWidth = 1 + 6 * treble;
      ctx.strokeStyle = `hsla(${(hueBase + 20) % 360}, 100%, 60%, ${0.10 + 0.15 * treble})`;
      ctx.ellipse(0, 0, R * (1.0 + 0.08 * Math.sin(tm * 2.0)), R * (0.82 + 0.10 * Math.cos(tm * 1.6)), tm * 0.4, 0, TAU);
      ctx.stroke();

      ctx.restore();
    }

    function drawGridWarp(dt, bass, mid, treble) {
      const w = canvas.width, h = canvas.height;
      const tm = (performance.now() - t0) * 0.001;

      // Crisp-ish trails
      fade(0.10);

      const step = Math.floor(Math.max(26, Math.min(64, 58 - 28 * (bass + mid))));
      const amp = (0.018 + 0.085 * (bass * 0.65 + mid * 0.35)) * Math.min(w, h);
      const swirl = 0.6 + 2.2 * treble;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = 1 + 3 * treble;

      // Vertical lines
      for (let x0 = -step; x0 <= w + step; x0 += step) {
        const p = x0 / w;
        const hue = (hueBase + 220 * p + 120 * treble) % 360;
        ctx.beginPath();
        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${0.06 + 0.12 * (0.3 + 0.7 * mid)})`;
        for (let y = 0; y <= h; y += 16) {
          const ny = y / h;
          const dx =
            Math.sin(tm * (0.9 + bass * 2.0) + ny * TAU * (1.2 + swirl) + p * 3.0) * amp +
            Math.sin(tm * 1.7 + (p + ny) * TAU * 0.6) * amp * 0.35;
          const xx = x0 + dx;
          if (y === 0) ctx.moveTo(xx, y);
          else ctx.lineTo(xx, y);
        }
        ctx.stroke();
      }

      // Horizontal lines
      for (let y0 = -step; y0 <= h + step; y0 += step) {
        const p = y0 / h;
        const hue = (hueBase + 180 + 220 * p + 140 * mid) % 360;
        ctx.beginPath();
        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${0.05 + 0.10 * (0.3 + 0.7 * bass)})`;
        for (let x = 0; x <= w; x += 16) {
          const nx = x / w;
          const dy =
            Math.cos(tm * (1.0 + mid * 2.1) + nx * TAU * (1.1 + swirl) + p * 2.7) * amp +
            Math.cos(tm * 1.5 + (p - nx) * TAU * 0.55) * amp * 0.35;
          const yy = y0 + dy;
          if (x === 0) ctx.moveTo(x, yy);
          else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }

      ctx.restore();

      // Subtle center pulse
      const cx = w * 0.5, cy = h * 0.5;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${(hueBase + 40) % 360}, 100%, 60%, ${0.05 + 0.20 * bass})`;
      ctx.arc(cx, cy, 10 + 180 * bass, 0, TAU);
      ctx.fill();
    }

    function drawStrobeBloom(dt, bass, mid, treble) {
      const w = canvas.width, h = canvas.height;
      const tm = (performance.now() - t0) * 0.001;
      const cx = w * 0.5, cy = h * 0.5;

      // Keep motion readable; not a hard strobe. Trails do most of the work.
      fade(0.12);

      // Blooming shapes (always present)
      const petals = 10 + Math.floor(18 * treble);
      const baseR = Math.min(w, h) * (0.10 + 0.20 * mid);
      const wob = 0.6 + 2.0 * bass;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = 0; i < petals; i++) {
        const p = i / petals;
        const a = tm * (0.35 + 1.6 * (bass * 0.7 + treble * 0.3)) + p * TAU;
        const r = baseR * (0.9 + 0.6 * Math.sin(a * wob + p * 5.0)) + (40 + 220 * bass) * p;
        const hue = (hueBase + 360 * p + 180 * treble) % 360;

        ctx.beginPath();
        ctx.lineWidth = 1 + 10 * (treble * 0.6 + bass * 0.4);
        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${0.03 + 0.12 * (0.3 + 0.7 * mid)})`;
        ctx.arc(Math.cos(a) * 6, Math.sin(a) * 6, r, a, a + TAU * 0.55);
        ctx.stroke();
      }

      // Flash overlay (limited)
      if (flash > 0.001) {
        const a = Math.min(0.22, flash); // limiter
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = `hsla(${(hueBase + 30) % 360}, 100%, 70%, ${a})`;
        ctx.fillRect(-cx, -cy, w, h);
        ctx.restore();

        // A couple of shock rings
        const rings = 2;
        for (let k = 0; k < rings; k++) {
          const pp = ((tm * (0.6 + bass * 2.4)) + k / rings) % 1;
          const rr = pp * Math.hypot(cx, cy);
          ctx.beginPath();
          ctx.lineWidth = 1 + 10 * treble;
          ctx.strokeStyle = `hsla(${(hueBase + 60 + k * 40) % 360}, 100%, 65%, ${0.12 * (1 - pp) * Math.min(1, flash * 2)})`;
          ctx.arc(0, 0, rr, 0, TAU);
          ctx.stroke();
        }
      }

      ctx.restore();

      // Decay flash smoothly
      flash = Math.max(0, flash - dt * (1.8 + 2.8 * (0.5 + bass)));
    }

    // Main loop
    function frame(now) {
      const dt = Math.min(0.05, (now - (frame._last || now)) / 1000);
      frame._last = now;

      if (!paused) {
        // Update analysis
        let bass = 0, mid = 0, treble = 0;
        if (analyser) {
          analyser.getByteFrequencyData(freq);
          analyser.getByteTimeDomainData(time);

          // Bands (very rough):
          // freq bins ~ linear in Hz up to sampleRate/2; good enough for vibe
          const n = freq.length;
          const b = avgBand(freq, 0, Math.floor(n * 0.08));
          const m = avgBand(freq, Math.floor(n * 0.08), Math.floor(n * 0.30));
          const t = avgBand(freq, Math.floor(n * 0.30), Math.floor(n * 0.65));

          bass = clamp01(b / 255);
          mid = clamp01(m / 255);
          treble = clamp01(t / 255);
        }

        // Color drift is driven by energy
        const energy = (bass * 0.55 + mid * 0.30 + treble * 0.15);
        hueBase = (hueBase + dt * (18 + 180 * energy)) % 360;

        // Transient detection -> drives a limited flash (no harsh strobe)
        const delta = Math.max(0, energy - prevEnergy);
        prevEnergy = energy;
        // Threshold + soft gain; cap to keep it safe
        flash = Math.min(0.35, flash + Math.max(0, delta - 0.03) * (2.2 + 3.5 * treble));

        // If audio isn't started yet, show a subtle idle effect
        if (!analyser) {
          fade(0.12);
          const w = canvas.width, h = canvas.height;
          const tm = (now - t0) * 0.001;
          const cx = w * 0.5, cy = h * 0.5;
          for (let i = 0; i < 18; i++) {
            const p = i / 18;
            const rr = (0.10 + 0.75 * p) * Math.min(w, h);
            ctx.beginPath();
            ctx.lineWidth = 1 + 1.5 * (1 - p);
            ctx.strokeStyle = `hsla(${(hueBase + p * 260) % 360}, 100%, 60%, ${0.08 + 0.08 * (1 - p)})`;
            ctx.arc(cx, cy, rr * (0.75 + 0.25 * Math.sin(tm + p * 6)), 0, TAU);
            ctx.stroke();
          }
        } else {
          const mode = MODES[modeIndex];
          if (mode === 'tunnel') drawTunnel(dt, bass, mid, treble);
          else if (mode === 'ribbons') drawRibbons(dt, bass, mid, treble, time);
          else if (mode === 'plasma') drawPlasma(dt, bass, mid, treble);
          else if (mode === 'kaleido') drawKaleido(dt, bass, mid, treble, freq);
          else if (mode === 'orbitals') drawOrbitals(dt, bass, mid, treble, time);
          else if (mode === 'gridwarp') drawGridWarp(dt, bass, mid, treble);
          else drawStrobeBloom(dt, bass, mid, treble);
        }
      }

      requestAnimationFrame(frame);
    }

    // Clear once
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    requestAnimationFrame(frame);

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === 'f' || key === 'F') { e.preventDefault(); toggleFullscreen(); }
      if (key === 'h' || key === 'H') { e.preventDefault(); setUIHidden(!uiHidden); }
      if (key === ' ') { e.preventDefault(); paused = !paused; }
      if (key === 'ArrowRight') { e.preventDefault(); modeIndex = (modeIndex + 1) % MODES.length; updateModeLabel(); }
      if (key === 'ArrowLeft') { e.preventDefault(); modeIndex = (modeIndex - 1 + MODES.length) % MODES.length; updateModeLabel(); }
    }, { passive: false });

    // Make fullscreen button reflect state
    document.addEventListener('fullscreenchange', () => {
      btnFS.textContent = document.fullscreenElement ? 'Exit FS' : 'Fullscreen';
      resize();
    });

    // Allow click on canvas to start audio (convenient)
    canvas.addEventListener('pointerdown', () => {
      if (!started) startAudio();
    });

    // If user toggles fullscreen, hide UI optionally by double click
    canvas.addEventListener('dblclick', () => setUIHidden(!uiHidden));

    // Disable overscroll / touch gestures interfering with fullscreen
    document.addEventListener('gesturestart', (e) => e.preventDefault?.(), { passive: false });
  })();
  </script>
</body>
</html>
